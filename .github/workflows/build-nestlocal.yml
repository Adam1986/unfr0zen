name: Build Nestlocal ARMv7

on:
  workflow_dispatch:
  push:
    branches:
      - feature/opentherm-support
      - feature/opentherm-support-v055
      - feature/opentherm-supply-temperature
      - feature/opentherm-supply-control
      - fix/opentherm-control-availability

permissions:
  contents: read

jobs:
  build:
    name: Build Nestlocal for ARMv7
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_RUSTFLAGS: >-
        -C link-arg=-Wl,-z,lazy
        -C relocation-model=static
        -C link-arg=-no-pie
        -C target-cpu=cortex-a8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            clang \
            binutils-arm-linux-gnueabihf \
            python3-pip \
            python3-venv

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add armv7-unknown-linux-gnueabihf

      - name: Install Zig and cargo-zigbuild
        run: |
          python3 -m venv "$HOME/zig-tools"
          "$HOME/zig-tools/bin/pip" install \
            ziglang==0.16.0 \
            cargo-zigbuild==0.23.4

          cat > "$HOME/zig-tools/bin/zig" <<'EOF'
          #!/bin/sh
          exec "$HOME/zig-tools/bin/python" -m ziglang "$@"
          EOF

          chmod +x "$HOME/zig-tools/bin/zig"

          echo "$HOME/zig-tools/bin" >> "$GITHUB_PATH"
          echo "CARGO_ZIGBUILD_PYTHON_PATH=$HOME/zig-tools/bin/python" >> "$GITHUB_ENV"

          "$HOME/zig-tools/bin/zig" version

      - name: Display toolchain versions
        run: |
          rustc --version
          cargo --version
          zig version
          command -v cargo-zigbuild
          "$HOME/zig-tools/bin/pip" show cargo-zigbuild

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nestlocal-armv7-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            nestlocal-armv7-

      - name: Test OpenTherm parser and discovery
        run: cargo test --locked -p nestlocal --bin nestlocal opentherm

      - name: Test True Radiant equipment discovery and commands
        run: cargo test --locked -p nestlocal --bin nestlocal true_radiant

      - name: Test Heat Link diagnostic capture
        run: cargo test --locked -p nestlocal --bin nestlocal heatlink_capture

      - name: Test upstream update and schedule logic
        run: |
          cargo test --locked -p nestlocal --bin nestlocal update::tests
          cargo test --locked -p nestlocal --bin nestlocal schedule

      - name: Validate managed supply-control command guards
        if: contains(fromJSON('["feature/opentherm-supply-temperature","feature/opentherm-supply-control"]'), github.ref_name)
        run: |
          sh platform/common/nlclient/tests/test-ot-handoff.sh
          cargo test --locked -p nestlocal --bin nestlocal supply_temperature_commands_fail_closed
          cargo test --locked -p nestlocal --bin nestlocal opentherm_retained_commands_leave_weather_and_readback_intact

      - name: Build Nestlocal
        run: |
          cargo zigbuild \
            --locked \
            -p nestlocal \
            --bin nestlocal \
            --profile thermostat \
            --target armv7-unknown-linux-gnueabihf.2.19

      - name: Prepare build artifact
        run: |
          mkdir -p build

          cp \
            target/armv7-unknown-linux-gnueabihf/thermostat/nestlocal \
            build/nestlocal-armv7

          file build/nestlocal-armv7
          ls -lh build/nestlocal-armv7

          arm-linux-gnueabihf-readelf \
            -h build/nestlocal-armv7

          sha256sum build/nestlocal-armv7 \
            > build/nestlocal-armv7.sha256

      - name: Package matching managed native object and build metadata
        if: contains(fromJSON('["feature/opentherm-supply-temperature","feature/opentherm-supply-control"]'), github.ref_name)
        run: |
          UNFR0ZEN_OT_SUPPLY_EXPERIMENT=4 sh platform/common/nlclient/build.sh build/native
          cp build/native/managed-custom-screen.o build/managed-custom-screen.o
          readelf -Ws build/managed-custom-screen.o > build/managed-native-symbols.txt
          grep -q ot_managed_event build/managed-native-symbols.txt
          grep -q native_ot_supply_set build/managed-native-symbols.txt
          arm-linux-gnueabihf-readelf -l build/nestlocal-armv7 > build/nestlocal-program-headers.txt
          arm-linux-gnueabihf-readelf -V build/nestlocal-armv7 > build/nestlocal-version-info.txt
          git rev-parse HEAD > build/source-commit.txt
          (cd build && sha256sum nestlocal-armv7 managed-custom-screen.o > managed-control-sha256.txt)
          # No stock firmware, patched firmware, installer, OTA or signing keys.
          # This artifact alone does not enable the opt-in control.

      - name: Upload matching managed control components
        if: contains(fromJSON('["feature/opentherm-supply-temperature","feature/opentherm-supply-control"]'), github.ref_name)
        uses: actions/upload-artifact@v4
        with:
          name: opentherm-managed-control-armv7
          path: |
            build/nestlocal-armv7
            build/managed-custom-screen.o
            build/managed-native-symbols.txt
            build/nestlocal-program-headers.txt
            build/nestlocal-version-info.txt
            build/source-commit.txt
            build/managed-control-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Nestlocal artifact
        uses: actions/upload-artifact@v4
        with:
          name: nestlocal-armv7
          path: |
            build/nestlocal-armv7
            build/nestlocal-armv7.sha256
          if-no-files-found: error
          retention-days: 14
