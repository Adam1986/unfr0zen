name: Test experimental OpenTherm supply control

on:
  push:
    branches:
      - feature/opentherm-supply-temperature
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang
      - name: Prepare Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Test disabled supply temperature commands
        run: cargo test --locked -p nestlocal --bin nestlocal experimental_supply_temperature_commands_fail_closed
      - name: Test OpenTherm and existing command handling
        run: |
          cargo test --locked -p nestlocal --bin nestlocal opentherm
          cargo test --locked -p nestlocal --bin nestlocal commands::tests
          cargo test --locked -p nestlocal --bin nestlocal true_radiant
          cargo test --locked -p nestlocal --bin nestlocal schedule
      - name: Check native firmware builder tests
        run: cargo test --locked -p unfr0zen-core --lib
