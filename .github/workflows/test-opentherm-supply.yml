name: Test managed OpenTherm supply control

on:
  push:
    branches:
      - feature/opentherm-supply-temperature
      - feature/opentherm-supply-control
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang
      - name: Install ARM emulator and linker
        run: sudo apt-get install -y qemu-user lld
      - name: Execute mock native ARM ABI tests
        run: bash platform/common/nlclient/tests/opentherm-supply-abi.sh
      - name: Execute read-only native supply observer
        run: bash platform/common/nlclient/tests/opentherm-supply-probe.sh
      - name: Test guarded supply handoff and ARM object modes
        run: sh platform/common/nlclient/tests/test-ot-handoff.sh
      - name: Prepare Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Check Rust formatting and parse all workspace crates
        run: cargo fmt --all -- --check
      - name: Test supply temperature command gates
        run: cargo test --locked -p nestlocal --bin nestlocal supply_temperature_commands_fail_closed
      - name: Test MQTT packet handling and retained metadata
        run: |
          cargo test --locked -p nestlocal --bin nestlocal mqtt::tests::a_session_with_a_loopback_broker
          cargo test --locked -p nestlocal --bin nestlocal mqtt::tests::publishes_as_they_arrive
          cargo test --locked -p nestlocal --bin nestlocal opentherm_retained_commands_leave_weather_and_readback_intact
      - name: Test OpenTherm and existing command handling
        run: |
          cargo test --locked -p nestlocal --bin nestlocal opentherm
          cargo test --locked -p nestlocal --bin nestlocal commands::tests
          cargo test --locked -p nestlocal --bin nestlocal true_radiant
          cargo test --locked -p nestlocal --bin nestlocal schedule
      - name: Check native firmware builder tests
        run: cargo test --locked -p unfr0zen-core --lib

      - name: Build host-only real-image audit kit
        run: |
          cargo build --locked -p unfr0zen-core --bin nlclient
          mkdir -p audit-kit
          cp target/debug/nlclient audit-kit/nlclient-audit
          for mode in 0 1 2 3 4; do
            UNFR0ZEN_OT_SUPPLY_EXPERIMENT=$mode sh platform/common/nlclient/build.sh "audit-kit/mode-$mode"
          done
          # This is a host diagnostic kit only; no stock or patched firmware.
          tar -czf opentherm-host-audit.tar.gz -C audit-kit .
      - uses: actions/upload-artifact@v4
        with:
          name: opentherm-host-audit
          path: opentherm-host-audit.tar.gz
          retention-days: 3
          if-no-files-found: error
