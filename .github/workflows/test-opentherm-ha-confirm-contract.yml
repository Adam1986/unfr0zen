name: Validate supervised OpenTherm HA confirmation contract

on:
  push:
    branches:
      - feature/opentherm-supply-temperature
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Check managed ACK/file hand-off contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Rust/C ABI and native claim filenames
        run: sh platform/common/nlclient/tests/ot-supply-ha-confirm-contract.sh
